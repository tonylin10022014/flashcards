<style>
.flip-card-inner { transition: transform 0.6s; transform-style: preserve-3d; }
.is-flipped .flip-card-inner { transform: rotateY(180deg); }
.flip-card-front, .flip-card-back { backface-visibility: hidden; position: absolute; top:0; left:0; width:100%; height:100%; }
.flip-card-back { transform: rotateY(180deg); }
canvas { touch-action: none; }
.phonics-container { position: relative; display: inline-grid; justify-items: center; align-items: center; padding: 30px 4px 30px 4px; overflow: visible !important; }
.phonics-char { position: relative; text-align: center; padding: 0 2px; overflow: visible !important; }
.phonics-dot { position: absolute; bottom: 2px; left: 50%; transform: translateX(-50%) translateY(100%); width: 8px; height: 8px; border-radius: 50%; }
.phonics-arc { position: absolute; top: 2px; height: 22px; border-bottom: none; border-radius: 50% 50% 0 0; box-sizing: border-box; pointer-events: none; }
@keyframes star-burst { 0% { transform: scale(0) rotate(0deg); opacity: 1; } 50% { transform: scale(1.5) rotate(180deg); opacity: 1; } 100% { transform: scale(2.5) rotate(360deg) translateY(-100px); opacity: 0; } }
@keyframes shake-x { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-12px); } 40% { transform: translateX(12px); } 60% { transform: translateX(-8px); } 80% { transform: translateX(8px); } }
.shake-anim { animation: shake-x 0.5s ease-in-out; }
@keyframes door-open-anim { 0% { transform: rotateY(0deg); } 100% { transform: rotateY(-85deg); } }
.door-open-anim { animation: door-open-anim 1s forwards; transform-origin: left center; }
@keyframes glow-pulse { 0%, 100% { box-shadow: 0 0 20px gold; } 50% { box-shadow: 0 0 50px gold, 0 0 80px orange; } }
.glow-anim { animation: glow-pulse 1.5s ease-in-out infinite; }
@keyframes fade-in-up { from { opacity: 0; transform: scale(0.5) translateY(20px); } to { opacity: 1; transform: scale(1) translateY(0); } }
.fade-in-up { animation: fade-in-up 0.5s ease-out; }
@keyframes bounce-in { 0% { transform: scale(0); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
.bounce-in { animation: bounce-in 0.5s ease-out; }
</style>
</head>

<div id="celebration-container" class="fixed inset-0 pointer-events-none z-[100]"></div>

<div x-data="flashcardApp()" x-init="init()" class="w-full max-w-2xl px-4 flex flex-col items-center">

<!-- ========== NORMAL MODE ========== -->
<div x-show="currentMode === 'normal'" class="w-full flex flex-col items-center">
<div class="w-full flex justify-between items-center mb-3">
<h1 class="text-2xl font-bold text-indigo-900">學習閃卡系統</h1>
<div class="flex gap-2">
<button @click="openAddModal()" class="bg-indigo-600 text-white px-3 py-2 rounded shadow hover:bg-indigo-700 font-bold text-sm">➕ 新增</button>
<button @click="exportExcelWithImages()" class="bg-blue-600 text-white px-3 py-2 rounded shadow hover:bg-blue-700 font-bold text-sm">📤 下載</button>
</div>
</div>
<div class="w-full overflow-x-auto whitespace-nowrap mb-3 pb-2 border-b-2 border-gray-200">
<template x-for="deck in deckNames" :key="deck">
<button @click="setDeck(deck)" :class="currentDeckName === deck ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-indigo-600 border border-indigo-300'" class="px-4 py-2 mr-2 rounded-lg font-bold inline-block text-sm" x-text="deck"></button>
</template>
</div>
<div class="flex flex-wrap justify-between items-center w-full mb-3 bg-white p-3 rounded-lg shadow-sm border border-gray-100 gap-3">
<div class="flex items-center gap-2 cursor-pointer" @click="autoPronounce = !autoPronounce; if(autoPronounce) speakWord(currentObj.word)">
<span class="text-sm font-bold text-gray-700">自動發音</span>
<div class="relative inline-flex h-6 w-11 items-center rounded-full transition-colors" :class="autoPronounce ? 'bg-green-500' : 'bg-gray-300'"><span class="inline-block h-4 w-4 transform rounded-full bg-white transition-transform" :class="autoPronounce ? 'translate-x-6' : 'translate-x-1'"></span></div>
</div>
<div class="flex items-center gap-2 flex-1 justify-end">
<span class="text-sm font-bold text-gray-700">正面:</span>
<select x-model="displayMode" class="border-2 border-indigo-200 rounded-lg p-1 text-sm font-bold text-indigo-800 outline-none bg-indigo-50">
<option value="word">僅詞彙</option><option value="translation">僅翻譯</option><option value="example">僅例句</option>
<option value="photo">僅照片</option><option value="word_translation">詞彙+翻譯</option>
<option value="word_example">詞彙+例句</option><option value="all">全顯示</option>
</select>
</div>
</div>
<div class="flex flex-wrap justify-between items-center w-full mb-4 gap-2">
<div class="flex gap-1 bg-white p-1 rounded-lg border border-gray-200 shadow-sm flex-1">
<button @click="filterMode = 'review'; filterList()" :class="filterMode === 'review' ? 'bg-red-500 text-white' : 'text-gray-600'" class="flex-1 py-1 px-2 rounded font-bold text-xs">🔄 需複習</button>
<button @click="filterMode = 'all'; filterList()" :class="filterMode === 'all' ? 'bg-indigo-500 text-white' : 'text-gray-600'" class="flex-1 py-1 px-2 rounded font-bold text-xs">📚 全部</button>
</div>
<button @click="startStudyMode()" class="px-3 py-2 bg-blue-600 text-white font-bold rounded-lg shadow text-sm">🎯 學習</button>
<button @click="startGridMode()" class="px-3 py-2 bg-purple-600 text-white font-bold rounded-lg shadow text-sm">🔠 宮格</button>
<button @click="startWhack()" class="px-3 py-2 bg-pink-500 text-white font-bold rounded-lg shadow text-sm">🎮 拍拍</button>
<button @click="startMagic()" class="px-3 py-2 bg-amber-600 text-white font-bold rounded-lg shadow text-sm">🚪 通關</button>
</div>
<div class="flex justify-between w-full mb-2 text-sm font-bold bg-white p-3 rounded-lg shadow-sm">
<span class="text-green-600">✅ <span x-text="knownCount"></span></span>
<span class="text-red-500">🔄 <span x-text="reviewCount"></span></span>
<span class="text-indigo-800"><span x-text="activeList.length > 0 ? currentIndex + 1 : 0"></span>/<span x-text="activeList.length"></span></span>
</div>
<div class="w-full mb-2 flex items-center gap-2 flex-wrap">
<button @click="toggleAutoPlay()" class="px-3 py-2 rounded-lg font-bold text-sm" :class="autoPlay ? 'bg-red-500 text-white' : 'bg-blue-100 text-blue-700'">
<span x-show="!autoPlay">▶️ 自動播放</span><span x-show="autoPlay">⏹️ 停止</span>
</button>
<div x-show="!autoPlay" class="flex items-center gap-1 text-xs"><span class="text-gray-500">每字</span><input type="number" x-model.number="autoPlayInterval" min="500" max="10000" step="500" class="w-16 border rounded p-1 text-center"><span class="text-gray-500">ms</span></div>
<div class="text-xs font-bold text-gray-500" x-show="activeList.length > 0">預估: <span x-text="autoPlayEstimate"></span></div>
</div>
<template x-if="activeList.length > 0">
<div class="w-full h-80 relative cursor-pointer select-none mb-4" :class="showDetails ? 'is-flipped' : ''" @click="showDetails = !showDetails" style="perspective: 1000px;">
<div class="flip-card-inner w-full h-full relative shadow-xl rounded-2xl">
<div class="flip-card-front bg-white rounded-2xl flex flex-col items-center justify-center border-t-8 p-4" :class="currentObj.status === '已記住' ? 'border-green-500' : 'border-indigo-500'">
<div class="absolute top-2 right-2 flex gap-1 z-10">
<button @click.stop="openDrawModal()" class="text-gray-400 hover:text-purple-600 p-1 font-bold text-sm bg-purple-50 px-2 rounded border border-purple-100">📷</button>
<button @click.stop="openEditModal()" class="text-gray-400 hover:text-indigo-600 p-1 font-bold text-sm bg-indigo-50 px-2 rounded border border-indigo-100">✏️</button>
<div @click.stop="speakWord(currentObj.word)" class="p-1 cursor-pointer"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-400 hover:text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.586l4.707 4.707A1 1 0 0016 19.318V4.682a1 1 0 00-1.707-.707L9.586 8H7a2 2 0 00-2 2z" /></svg></div>
</div>
<div class="w-full flex-1 flex flex-col items-center justify-center overflow-hidden mt-6">
<template x-if="displayMode === 'photo' || displayMode === 'all'"><img x-show="currentObj.image" :src="currentObj.image" class="max-h-32 object-contain mb-3 rounded shadow-sm"></template>
<template x-if="displayMode === 'word' || displayMode === 'word_example' || displayMode === 'word_translation' || displayMode === 'all'"><div class="text-[3rem] md:text-[4.5rem] font-bold text-slate-800 text-center leading-tight mb-2 w-full" x-html="renderPhonics(currentObj)"></div></template>
<template x-if="displayMode === 'translation' || displayMode === 'word_translation' || displayMode === 'all'"><span class="text-xl md:text-2xl font-bold text-teal-600 text-center mb-2 px-4" x-text="currentObj.translation || '(無翻譯)'"></span></template>
<template x-if="displayMode === 'example' || displayMode === 'word_example' || displayMode === 'all'"><span class="text-sm md:text-lg text-slate-600 text-center px-4 line-clamp-3" x-text="currentObj.example || '(無例句)'"></span></template>
</div>
</div>
<div class="flip-card-back bg-slate-50 rounded-2xl border-4 border-indigo-200 flex flex-col items-center justify-center p-4 text-center overflow-hidden">
<div class="absolute top-2 right-2 p-1 text-gray-400 text-xs font-bold">📖 背面</div>
<template x-if="currentObj.image"><img :src="currentObj.image" class="max-h-28 object-contain mb-3 rounded border border-gray-300 bg-white shadow-sm"></template>
<div class="text-2xl font-bold text-indigo-900 mb-1 w-full" x-html="renderPhonics(currentObj)"></div>
<template x-if="currentObj.translation"><div class="text-lg font-bold text-teal-700 mb-2" x-text="currentObj.translation"></div></template>
<template x-if="currentObj.example"><div class="text-sm text-slate-700 bg-white p-3 rounded-lg shadow-sm w-full" x-text="currentObj.example"></div></template>
</div>
</div>
</div>
</template>
<div class="flex justify-between w-full mb-4 gap-4" x-show="activeList.length > 0">
<button @click="prevCard()" class="flex-1 py-2 bg-gray-200 rounded-xl font-bold text-gray-700">⬅️</button>
<button @click="nextCard()" class="flex-1 py-2 bg-indigo-100 rounded-xl font-bold text-indigo-700">➡️</button>
</div>
<div class="flex justify-between w-full gap-4" x-show="activeList.length > 0">
<button @click="markStatus('已記住')" class="flex-1 py-3 border-2 border-green-500 rounded-xl font-bold" :class="currentObj.status === '已記住' ? 'bg-green-500 text-white' : 'bg-white text-green-600'">✅ 已記住</button>
<button @click="markStatus('需複習')" class="flex-1 py-3 border-2 border-red-500 rounded-xl font-bold" :class="currentObj.status === '需複習' ? 'bg-red-500 text-white' : 'bg-white text-red-600'">🔄 需複習</button>
</div>
</div>

<!-- ========== STUDY MODE ========== -->
<div x-show="currentMode === 'study'" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center select-none p-4" style="display: none;">
<button @click="currentMode = 'normal'; stopAutoPlay()" class="absolute top-6 right-6 p-4 text-gray-400 hover:text-red-500 text-xl font-bold z-50 bg-gray-100 rounded-full">✖</button>
<div class="absolute top-6 left-6 flex items-center gap-3 z-50">
<button @click="toggleAutoPlay()" class="px-4 py-2 rounded-full font-bold text-sm" :class="autoPlay ? 'bg-red-500 text-white' : 'bg-blue-100 text-blue-700'"><span x-show="!autoPlay">▶️ 自動</span><span x-show="autoPlay">⏹️ 停止</span></button>
<div class="text-xs font-bold text-gray-400" x-show="activeList.length > 0">預估: <span x-text="autoPlayEstimate"></span></div>
</div>
<div @click="nextCard()" class="w-full h-full flex flex-col items-center justify-center cursor-pointer">
<template x-if="displayMode === 'photo' || displayMode === 'all'"><img x-show="currentObj.image" :src="currentObj.image" class="max-h-[40vh] max-w-full object-contain mb-8 rounded-xl shadow-lg border-4 border-gray-100"></template>
<template x-if="displayMode === 'word' || displayMode === 'word_example' || displayMode === 'word_translation' || displayMode === 'all'"><div class="text-[12vw] md:text-[10vw] font-black text-slate-800 text-center leading-tight mb-4 w-full" x-html="renderPhonics(currentObj)"></div></template>
<template x-if="displayMode === 'translation' || displayMode === 'word_translation' || displayMode === 'all'"><span class="text-[6vw] md:text-[4vw] font-bold text-teal-600 text-center leading-tight mb-6" x-text="currentObj.translation || '(無翻譯)'"></span></template>
<template x-if="displayMode === 'example' || displayMode === 'word_example' || displayMode === 'all'"><span class="text-[5vw] md:text-[3vw] font-bold text-slate-600 text-center px-8" x-text="currentObj.example || '(無例句)'"></span></template>
</div>
<div class="absolute bottom-6 text-gray-300 text-sm font-bold" x-show="!autoPlay">點擊畫面切換</div>
<div class="absolute bottom-6 text-blue-500 text-sm font-bold" x-show="autoPlay">自動播放中...</div>
</div>

<!-- ========== GRID MODE (fixed centering for all sizes) ========== -->
<div x-show="currentMode === 'grid'" class="w-full flex flex-col items-center" style="display: none;">
<div class="w-full flex justify-between items-center mb-4">
<button @click="currentMode = 'normal'" class="text-indigo-600 font-bold bg-indigo-50 px-4 py-2 rounded-lg">⬅️ 返回</button>
<h2 class="text-xl font-bold text-purple-700 flex-1 text-center" x-text="currentDeckName + ' 記憶檢測'"></h2>
</div>
<div class="flex flex-wrap gap-2 w-full mb-6">
<select x-model.number="gridSize" @change="initGrid()" class="border-2 border-purple-300 rounded-lg p-2 font-bold text-purple-800 outline-none">
<option value="3">3宮格</option><option value="5">5宮格</option><option value="9" selected>9宮格</option>
<option value="10">10宮格</option><option value="16">16宮格</option><option value="25">25宮格</option><option value="50">50宮格</option>
</select>
<input type="number" x-model.number="gridSize" @change="initGrid()" min="1" max="100" class="w-16 border-2 border-purple-300 rounded-lg p-2 text-center font-bold" placeholder="自訂">
<select x-model="gridDisplayType" class="flex-1 border-2 border-purple-300 rounded-lg p-2 font-bold text-purple-800 outline-none">
<option value="word">詞彙</option><option value="translation">翻譯</option><option value="example">例句</option><option value="image">圖片</option>
</select>
<button @click="initGrid()" class="bg-purple-500 text-white font-bold px-6 py-2 rounded-lg shadow hover:bg-purple-600">🔄 換批</button>
</div>
<!-- Auto-centered grid with max-width -->
<div class="w-full flex justify-center">
<div :style="'grid-template-columns: repeat(' + gridColumns + ', 1fr); max-width: ' + (gridItems.length > 20 ? '1000px' : '100%') + ';'" class="grid gap-1 md:gap-2 w-full mx-auto">
<template x-for="(item, gidx) in gridItems" :key="gidx">
<div class="bg-white border-2 border-indigo-100 shadow-sm rounded-xl flex flex-col items-center justify-center p-1 md:p-2 cursor-pointer aspect-square" @click="speakWord(item.word)">
<template x-if="gridDisplayType === 'word'"><div class="font-bold text-slate-800 w-full text-center" :class="gridItems.length <= 3 ? 'text-5xl' : gridItems.length <= 9 ? 'text-3xl md:text-5xl' : gridItems.length <= 16 ? 'text-xl md:text-2xl' : gridItems.length <= 25 ? 'text-base md:text-lg' : 'text-xs md:text-sm'" x-html="renderPhonics(item)"></div></template>
<template x-if="gridDisplayType === 'translation'"><span class="font-bold text-teal-700 text-center" :class="gridItems.length <= 3 ? 'text-4xl' : gridItems.length <= 9 ? 'text-2xl md:text-4xl' : gridItems.length <= 25 ? 'text-sm md:text-lg' : 'text-[10px] md:text-xs'" x-text="item.translation || '(無)'"></span></template>
<template x-if="gridDisplayType === 'example'"><span class="font-bold text-slate-600 text-center line-clamp-4" :class="gridItems.length <= 9 ? 'text-sm' : 'text-[10px]'" x-text="item.example || '(無)'"></span></template>
<template x-if="gridDisplayType === 'image'"><div class="w-full h-full flex items-center justify-center"><template x-if="item.image"><img :src="item.image" class="max-h-full max-w-full object-contain rounded"></template><template x-if="!item.image"><span class="text-gray-400 font-bold text-xs">(無圖)</span></template></div></template>
</div>
</template>
</div>
</div>
</div>

<!-- ========== WHACK GAME ========== -->
<div x-show="currentMode === 'whack'" class="w-full flex flex-col items-center" style="display: none;">
<div class="w-full flex justify-between items-center mb-4">
<button @click="currentMode = 'normal'" class="text-pink-600 font-bold bg-pink-50 px-4 py-2 rounded-lg">⬅️ 返回</button>
<h2 class="text-2xl font-black text-pink-600 flex-1 text-center">🎮 快手拍拍樂</h2>
</div>
<div class="w-full flex justify-around items-center mb-4 bg-gradient-to-r from-pink-100 to-purple-100 p-3 rounded-xl shadow">
<div class="text-center"><div class="text-xs font-bold text-gray-500">分數</div><div class="text-3xl font-black text-pink-600" x-text="whackScore"></div></div>
<div class="text-center"><div class="text-xs font-bold text-gray-500">回合</div><div class="text-3xl font-black text-purple-600"><span x-text="whackRounds"></span>/<span x-text="whackMaxRounds"></span></div></div>

<script>
function flashcardApp() {
    return {
        // ===== STATE =====
        decks: {}, currentDeckName: '', currentMode: 'normal', displayMode: 'word',
        filterMode: 'review', autoPronounce: false, showDetails: false,
        currentIndex: 0, activeList: [], currentObj: {},
        autoPlay: false, autoPlayTimer: null, autoPlayInterval: 1000,
        showDrawModal: false, currentTool: 'draw', brushColor: '#FF0000', stampEmoji: '⭐',
        searchResults: [], isSearchingImage: false, isDrawing: false, canvas: null, ctx: null,
        showEditModal: false, editingWord: '', editingTranslation: '', editingExample: '',
        editingPhonics: [], editingMode: 'edit',
        translationResults: [], isTranslating: false,
        exampleResults: [], isSearchingExamples: false,
        autoFillMode: 'replace',
        strokeBrushColor: '#FF0000',
        strokeDataCache: {},
        gridItems: [], gridDisplayType: 'word', gridSize: 9,
        whackCards: [], whackTarget: null, whackScore: 0, whackRounds: 0,
        whackMaxRounds: 10, whackGameOver: false,
        magicWord: null, magicDoorOpen: false, magicListening: false,
        magicResult: null, magicReward: null, magicScore: 0, magicAttempts: 0,

        // ===== COMPUTED =====
        get deckNames() { return Object.keys(this.decks || {}); },
        get knownCount() { return this.activeList.filter(i => i.status === '已記住').length; },
        get reviewCount() { return this.activeList.filter(i => i.status === '需複習').length; },
        get autoPlayEstimate() { const t = this.activeList.length; const s = t * (this.autoPlayInterval / 1000); return Math.floor(s / 60) + '分' + Math.round(s % 60) + '秒'; },
        get gridColumns() {
            const n = this.gridItems.length || parseInt(this.gridSize) || 9;
            const tgt = parseInt(this.gridSize) || 9;
            const lk = {3:3, 5:3, 9:3, 10:5, 16:4, 25:5, 50:10};
            let cols = lk[tgt] || Math.ceil(Math.sqrt(tgt));
            if (n < cols) cols = n;
            if (n <= 3) cols = n;
            return cols;
        },

        // ===== INIT =====
        async init() {
            try { const d = document.getElementById('decks-data'); if (d) this.decks = JSON.parse(d.textContent); } catch(e) {}
            const s = localStorage.getItem('flashcardData');
            if (s) { try { this.decks = JSON.parse(s); } catch(e) {} }
            if (this.deckNames.length > 0) this.setDeck(this.deckNames[0]);
            // Preload stroke data for all Chinese chars
            await this.preloadStrokeData();
        },

        async preloadStrokeData() {
            const chars = new Set();
            for (const items of Object.values(this.decks)) {
                for (const item of items) {
                    for (const ch of [...(item.word || '')]) {
                        if (/[一-鿿]/.test(ch)) chars.add(ch);
                    }
                }
            }
            for (const ch of chars) { await this.loadStrokeData(ch); }
        },

        async loadStrokeData(char) {
            if (this.strokeDataCache[char]) return this.strokeDataCache[char];
            try {
                const r = await fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/' + encodeURIComponent(char) + '.json');
                if (!r.ok) return null;
                const d = await r.json();
                this.strokeDataCache[char] = d;
                return d;
            } catch(e) { return null; }
        },

        setDeck(n) { this.currentDeckName = n; this.filterList(); },
        filterList() { const d = this.decks[this.currentDeckName] || []; this.activeList = this.filterMode === 'review' ? d.filter(i => i.status === '需複習') : [...d]; this.currentIndex = 0; if (this.activeList.length > 0) this.currentObj = this.activeList[0]; },
        nextCard() { if (!this.activeList.length) return; this.currentIndex = (this.currentIndex + 1) % this.activeList.length; this.currentObj = this.activeList[this.currentIndex]; this.showDetails = false; if (this.autoPronounce) this.speakWord(this.currentObj.word); },
        prevCard() { if (!this.activeList.length) return; this.currentIndex = (this.currentIndex - 1 + this.activeList.length) % this.activeList.length; this.currentObj = this.activeList[this.currentIndex]; this.showDetails = false; },
        markStatus(s) { this.currentObj.status = s; this.saveToLocalStorage(); setTimeout(() => this.nextCard(), 200); },
        toggleAutoPlay() { this.autoPlay ? this.stopAutoPlay() : this.startAutoPlay(); },
        startAutoPlay() { if (!this.activeList.length) return; this.autoPlay = true; this.autoPlayTimer = setInterval(() => this.nextCard(), this.autoPlayInterval); if (this.autoPronounce) this.speakWord(this.currentObj.word); },
        stopAutoPlay() { this.autoPlay = false; if (this.autoPlayTimer) { clearInterval(this.autoPlayTimer); this.autoPlayTimer = null; } },
        startStudyMode() { this.currentMode = 'study'; },
        startGridMode() { this.currentMode = 'grid'; this.initGrid(); },
        initGrid() { const d = this.decks[this.currentDeckName] || []; const sz = Math.min(parseInt(this.gridSize) || 9, d.length); this.gridItems = [...d].sort(() => Math.random() - 0.5).slice(0, sz); },
        speakWord(w) { if (!w) return; if ('speechSynthesis' in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(w); u.lang = /[一-鿿]/.test(w) ? 'zh-TW' : 'en-US'; u.rate = 0.8; speechSynthesis.speak(u); } },

        // ===== RENDER PHONICS (SVG for Chinese stroke coloring + fixed dot position) =====
        renderPhonics(obj) {
            const word = (obj && obj.word) || '';
            if (!obj || !obj.phonics || obj.phonics.length === 0) return word;
            const chars = [...word]; const n = chars.length; if (n === 0) return '';
            const pm = {}; obj.phonics.forEach(p => { if (p.charIndex !== undefined) pm[p.charIndex] = p; });
            // Continuous arcs
            const arcs = []; let i = 0;
            while (i < n - 1) {
                const p = pm[i];
                if (p && p.connectRight) { const st = i; const lc = p.lineColor || '#6366f1'; while (i < n - 1 && pm[i] && pm[i].connectRight) i++; arcs.push({start: st, end: i, color: lc}); }
                else i++;
            }
            const hasChinese = chars.some(c => /[一-鿿]/.test(c));
            const cw = hasChinese ? 60 : 42; const mw = n * cw;
            let html = '<div class="phonics-container" style="grid-template-columns:repeat(' + n + ',1fr);min-width:' + mw + 'px;">';
            chars.forEach((ch, idx) => {
                const p = pm[idx] || {};
                const color = p.color || '#1e293b';
                const hasDot = p.hasDot || false;
                const dotColor = p.dotColor || color;
                const hasUnderline = p.hasUnderline || false;
                const strokeColors = p.strokeColors || {};
                const isChinese = /[一-鿿]/.test(ch);
                let charHtml = '';
                if (isChinese && this.strokeDataCache[ch]) {
                    // SVG with individual stroke colors
                    const data = this.strokeDataCache[ch];
                    charHtml = '<svg viewBox="0 0 1024 1024" style="width:50px;height:50px;display:inline-block;">';
                    data.strokes.forEach((sp, si) => {
                        const sc = strokeColors[si] || color;
                        charHtml += '<path d="' + sp + '" fill="' + sc + '"/>';
                    });
                    charHtml += '</svg>';
                } else {
                    const partial = p.partial || 'full';
                    const sec = p.secondaryColor || '#94a3b8';
                    if (partial === 'full' || !partial) {
                        charHtml = '<span style="color:' + color + ';' + (hasUnderline ? 'text-decoration:underline;text-decoration-color:' + color + ';' : '') + '">' + ch + '</span>';
                    } else {
                        let g = partial === 'top' ? 'to bottom,' + color + ' 50%,' + sec + ' 50%' : partial === 'bottom' ? 'to top,' + color + ' 50%,' + sec + ' 50%' : partial === 'left' ? 'to right,' + color + ' 50%,' + sec + ' 50%' : 'to left,' + color + ' 50%,' + sec + ' 50%';
                        charHtml = '<span style="background:linear-gradient(' + g + ');-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;' + (hasUnderline ? 'text-decoration:underline;' : '') + '">' + ch + '</span>';
                    }
                }
                html += '<div class="phonics-char">';
                html += charHtml;
                if (hasDot) {
                    html += '<div class="phonics-dot" style="background:' + dotColor + ';"></div>';
                }
                html += '</div>';
            });
            arcs.forEach(a => {
                const lp = (a.start + 0.5) / n * 100; const wp = (a.end - a.start) / n * 100;
                html += '<div class="phonics-arc" style="left:' + lp + '%;width:' + wp + '%;border:3px solid ' + a.color + ';"></div>';
            });
            html += '</div>';
            return html;
        },

        // ===== RENDER CHAR SVG for phonics editor (clickable strokes) =====
        renderCharSvg(idx) {
            const chars = [...(this.editingWord || '')];
            const ch = chars[idx];
            if (!ch) return '';
            const p = this.editingPhonics[idx] || {};
            const color = p.color || '#1e293b';
            const strokeColors = p.strokeColors || {};
            const isChinese = /[一-鿿]/.test(ch);
            if (isChinese && this.strokeDataCache[ch]) {
                const data = this.strokeDataCache[ch];
                let svg = '<svg viewBox="0 0 1024 1024" style="width:60px;height:60px;">';
                data.strokes.forEach((sp, si) => {
                    const sc = strokeColors[si] || color;
                    svg += '<path d="' + sp + '" fill="' + sc + '" data-char-idx="' + idx + '" data-stroke-idx="' + si + '" style="cursor:pointer;"/>';
                });
                svg += '</svg>';
                return svg;
            }
            // Non-Chinese: show as text
            const partial = p.partial || 'full';
            const sec = p.secondaryColor || '#94a3b8';
            if (partial === 'full' || !partial) {
                return '<span style="font-size:2rem;font-weight:bold;color:' + color + ';">' + ch + '</span>';
            }
            let g = partial === 'top' ? 'to bottom,' + color + ' 50%,' + sec + ' 50%' : partial === 'bottom' ? 'to top,' + color + ' 50%,' + sec + ' 50%' : partial === 'left' ? 'to right,' + color + ' 50%,' + sec + ' 50%' : 'to left,' + color + ' 50%,' + sec + ' 50%';
            return '<span style="font-size:2rem;font-weight:bold;background:linear-gradient(' + g + ');-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;">' + ch + '</span>';
        },

        // ===== STROKE CLICK HANDLER =====
        handleStrokeClick(e) {
            if (e.target.tagName === 'path' && e.target.dataset.charIdx !== undefined) {
                const charIdx = parseInt(e.target.dataset.charIdx);
                const strokeIdx = parseInt(e.target.dataset.strokeIdx);
                this.toggleStrokeColor(charIdx, strokeIdx);
            }
        },
        toggleStrokeColor(charIdx, strokeIdx) {
            if (!this.editingPhonics[charIdx].strokeColors) this.editingPhonics[charIdx].strokeColors = {};
            const current = this.editingPhonics[charIdx].strokeColors[strokeIdx] || this.editingPhonics[charIdx].color || '#1e293b';
            if (current === this.strokeBrushColor) {
                delete this.editingPhonics[charIdx].strokeColors[strokeIdx];
            } else {
                this.editingPhonics[charIdx].strokeColors[strokeIdx] = this.strokeBrushColor;
            }
            // Force reactivity
            this.editingPhonics[charIdx].strokeColors = JSON.parse(JSON.stringify(this.editingPhonics[charIdx].strokeColors));
        },

        // ===== EDIT MODAL =====
        openAddModal() { this.editingWord=''; this.editingTranslation=''; this.editingExample=''; this.editingPhonics=[]; this.translationResults=[]; this.exampleResults=[]; this.editingMode='add'; this.showEditModal=true; },
        openEditModal() {
            this.editingWord=this.currentObj.word||''; this.editingTranslation=this.currentObj.translation||''; this.editingExample=this.currentObj.example||'';
            this.translationResults=[]; this.exampleResults=[]; this.editingMode='edit'; this.syncEditingPhonics(); this.showEditModal=true;
            // Preload stroke data for editing word
            this.$nextTick(async () => {
                for (const ch of [...this.editingWord]) {
                    if (/[一-鿿]/.test(ch)) await this.loadStrokeData(ch);
                }
            });
        },
        syncEditingPhonics() {
            const chars = [...(this.editingWord||'')]; const old=[...this.editingPhonics];
            this.editingPhonics = chars.map((ch, idx) => old[idx] || {
                charIndex: idx, color: '#1e293b', hasDot: false, dotColor: '#1e293b',
                partial: 'full', secondaryColor: '#94a3b8', connectRight: false, lineColor: '#6366f1',
                hasUnderline: false, strokeColors: {}
            });
        },
        saveEditModal() {
            if (this.editingMode === 'add') {
                if (!this.decks[this.currentDeckName]) this.decks[this.currentDeckName] = [];
                this.decks[this.currentDeckName].push({word:this.editingWord, translation:this.editingTranslation, image:'', example:this.editingExample, status:'需複習', phonics:JSON.parse(JSON.stringify(this.editingPhonics))});
            } else {
                this.currentObj.word=this.editingWord; this.currentObj.translation=this.editingTranslation; this.currentObj.example=this.editingExample; this.currentObj.phonics=JSON.parse(JSON.stringify(this.editingPhonics));
            }
            this.saveToLocalStorage(); this.filterList(); this.showEditModal=false;
        },

        // ===== AUTO TRANSLATE (APPEND results, Add/Replace on select) =====
        async autoTranslate() {
            this.isTranslating = true;
            const word = this.editingWord; if (!word) { this.isTranslating = false; return; }
            const isZh = /[一-鿿]/.test(word); const sl = isZh ? 'zh-TW' : 'en', tl = isZh ? 'en' : 'zh-TW';
            const newRes = new Set();
            try { const r = await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(word) + '&langpair=' + sl + '|' + tl); const d = await r.json(); if (d.responseData && d.responseData.translatedText) newRes.add(d.responseData.translatedText); if (d.matches) d.matches.forEach(m => { if (m.translation) newRes.add(m.translation); }); } catch(e) {}
            try { const r = await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=' + sl + '&tl=' + tl + '&dt=t&q=' + encodeURIComponent(word)); const d = await r.json(); if (d[0]) d[0].forEach(it => { if (it[0]) newRes.add(it[0]); }); } catch(e) {}
            try { const r = await fetch('https://lingva.ml/api/v1/' + sl + '/' + tl + '/' + encodeURIComponent(word)); const d = await r.json(); if (d.translation) newRes.add(d.translation); } catch(e) {}
            const existing = new Set(this.translationResults);
            newRes.forEach(r => { if (!existing.has(r) && r.toLowerCase() !== word.toLowerCase()) existing.add(r); });
            this.translationResults = [...existing].slice(0, 12);
            if (this.translationResults.length === 0) this.translationResults.push('(無法取得翻譯)');
            this.isTranslating = false;
        },
        selectTranslation(idx) {
            const trans = this.translationResults[idx];
            if (trans && !trans.startsWith('(')) {
                if (this.autoFillMode === 'add' && this.editingTranslation) this.editingTranslation = this.editingTranslation + ' / ' + trans;
                else this.editingTranslation = trans;
            }
        },

        // ===== AUTO EXAMPLES (improved sources + constructed common sentences) =====
        async autoSearchExamples() {
            this.isSearchingExamples = true;
            const word = this.editingWord; if (!word) { this.isSearchingExamples = false; return; }
            const isZh = /[一-鿿]/.test(word); const newRes = [];
            if (!isZh) {
                // Source 1: Free Dictionary API
                try { const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word)); const d = await r.json(); if (Array.isArray(d)) d.forEach(e => { if (e.meanings) e.meanings.forEach(m => { if (m.definitions) m.definitions.forEach(df => { if (df.example) newRes.push('🌐 ' + df.example); }); }); }); } catch(e) {}
                // Source 2: Tatoeba (native sentences)
                try { const u = 'https://tatoeba.org/eng/api_v0/search?query=' + encodeURIComponent(word) + '&from=eng&to=und&or=source_text_or_trans_text'; const r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(u)); const d = await r.json(); if (d.results) d.results.forEach(r => { if (r.text && r.text.length < 100) newRes.push('🌐 ' + r.text); }); } catch(e) {}
                // Source 3: Wordnik
                try { const u = 'https://api.wordnik.com/v4/word.json/' + encodeURIComponent(word) + '/examples?limit=3'; const r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(u)); const d = await r.json(); if (d.examples) d.examples.forEach(ex => { if (ex.text && ex.text.length < 100) newRes.push('📚 ' + ex.text); }); } catch(e) {}
                // Source 4: Constructed common children's sentences (most natural for pre-nursery)
                const lc = word.toLowerCase();
                const startsWithVowel = 'aeiou'.includes(lc[0]);
                const article = startsWithVowel ? 'an' : 'a';
                const constructed = [
                    '📝 I see ' + article + ' ' + word + '.',
                    '📝 The ' + word + ' is big.',
                    '📝 Do you like ' + word + '?',
                    '📝 Look at the ' + word + '!',
                    '📝 Where is the ' + word + '?',
                    '📝 I have ' + article + ' ' + word + '.',
                    '📝 This ' + word + ' is for you.',
                    '📝 The ' + word + ' is here.',
                ];
                constructed.forEach(s => newRes.push(s));
            } else {
                // Chinese: Tatoeba
                try { const u = 'https://tatoeba.org/eng/api_v0/search?query=' + encodeURIComponent(word) + '&from=cmn&to=eng'; const r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(u)); const d = await r.json(); if (d.results) d.results.forEach(r => { if (r.text && r.text.length < 30) newRes.push('🌐 ' + r.text); }); } catch(e) {}
                // Constructed common Chinese sentences for children
                const constructed = [
                    '📝 這是' + word + '。',
                    '📝 我喜歡' + word + '。',
                    '📝 ' + word + '在哪裡？',
                    '📝 看！' + word + '！',
                    '📝 我要' + word + '。',
                    '📝 ' + word + '真好玩！',
                    '📝 ' + word + '很好吃。',
                    '📝 這個' + word + '很大。',
                ];
                constructed.forEach(s => newRes.push(s));
            }
            // Dedup + sort by length (shorter = more common for children)
            const seen = new Set(); const deduped = [];
            newRes.forEach(r => { const k = r.toLowerCase().trim(); if (!seen.has(k) && k !== '') { seen.add(k); deduped.push(r); } });
            deduped.sort((a, b) => a.length - b.length);
            // Append to existing (don't clear)
            const existing = new Set(this.exampleResults);
            const existingSeen = new Set(this.exampleResults.map(r => r.toLowerCase().trim()));
            deduped.forEach(r => { if (!existingSeen.has(r.toLowerCase().trim())) { existing.add(r); existingSeen.add(r.toLowerCase().trim()); } });
            this.exampleResults = [...existing].slice(0, 12);
            if (this.exampleResults.length === 0) this.exampleResults.push('(無法取得例句)');
            this.isSearchingExamples = false;
        },
        selectExample(idx) {
            const ex = this.exampleResults[idx];
            if (ex && !ex.startsWith('(')) {
                // Remove prefix (🌐 📝 📚) when selecting
                const clean = ex.replace(/^[🌐📝📚] /, '');
                if (this.autoFillMode === 'add' && this.editingExample) this.editingExample = this.editingExample + ' ' + clean;
                else this.editingExample = clean;
            }
        },

        // ===== ONE-CLICK AUTO =====
        async autoTranslateAndExamples() {
            await Promise.all([this.autoTranslate(), this.autoSearchExamples()]);
            const fT = this.translationResults.find(r => !r.startsWith('('));
            const fE = this.exampleResults.find(r => !r.startsWith('('));
            if (fT) { if (this.autoFillMode === 'add' && this.editingTranslation) this.editingTranslation = this.editingTranslation + ' / ' + fT; else this.editingTranslation = fT; }
            if (fE) { const clean = fE.replace(/^[🌐📝📚] /, ''); if (this.autoFillMode === 'add' && this.editingExample) this.editingExample = this.editingExample + ' ' + clean; else this.editingExample = clean; }
        },

        // ===== WHACK GAME =====
        startWhack() { this.currentMode='whack'; this.whackScore=0; this.whackRounds=0; this.whackGameOver=false; this.nextWhackRound(); },
        nextWhackRound() { if (this.whackRounds >= this.whackMaxRounds) { this.whackGameOver=true; return; } this.whackRounds++; const d=this.decks[this.currentDeckName]||[]; if (d.length<3) { this.whackGameOver=true; return; } const sh=[...d].sort(()=>Math.random()-0.5); this.whackCards=sh.slice(0,3).map((item,idx)=>({...item,cardId:idx,shaking:false})); this.whackTarget=this.whackCards[Math.floor(Math.random()*3)]; setTimeout(()=>this.speakWord(this.whackTarget.word),500); },
        whackClick(card) { if (this.whackGameOver) return; if (card.word===this.whackTarget.word) { this.whackScore++; this.playCelebration(); setTimeout(()=>this.nextWhackRound(),1500); } else { card.shaking=true; setTimeout(()=>card.shaking=false,500); } },
        playCelebration() { const c=document.getElementById('celebration-container'); if(!c) return; c.innerHTML=''; const emojis=['⭐','✨','🌟','💫','🎉','🎊','🎆','🎇','🌈','🏆']; for(let i=0;i<20;i++){ const el=document.createElement('div'); el.textContent=emojis[Math.floor(Math.random()*emojis.length)]; el.style.cssText='position:absolute;font-size:'+(24+Math.random()*30)+'px;left:'+(10+Math.random()*80)+'%;top:'+(10+Math.random()*80)+'%;animation:star-burst 1.5s ease-out forwards;animation-delay:'+(Math.random()*0.3)+'s;'; c.appendChild(el); } this.playCheerSound(); setTimeout(()=>{c.innerHTML='';},2000); },
        playCheerSound() { try { const ctx=new (window.AudioContext||window.webkitAudioContext)(); const notes=[523.25,659.25,783.99,1046.50]; notes.forEach((freq,i)=>{ const osc=ctx.createOscillator(); const gain=ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.frequency.value=freq; osc.type='sine'; const t=ctx.currentTime+i*0.08; gain.gain.setValueAtTime(0,t); gain.gain.linearRampToValueAtTime(0.15,t+0.01); gain.gain.exponentialRampToValueAtTime(0.001,t+0.3); osc.start(t); osc.stop(t+0.3); }); } catch(e) {} },

        // ===== MAGIC GAME =====
        startMagic() { this.currentMode='magic'; this.magicScore=0; this.magicAttempts=0; this.nextMagicRound(); },
        nextMagicRound() { this.magicDoorOpen=false; this.magicResult=null; this.magicReward=null; const d=this.decks[this.currentDeckName]||[]; if(d.length===0) return; this.magicWord=d[Math.floor(Math.random()*d.length)]; },
        startSpeechRecognition() { const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){ alert('請使用 Chrome 瀏覽器'); return; } const rec=new SR(); rec.lang='zh-TW'; rec.continuous=false; rec.interimResults=false; this.magicListening=true; rec.onresult=(ev)=>{ const t=ev.results[0][0].transcript.trim(); this.magicListening=false; this.magicAttempts++; const target=this.magicWord?this.magicWord.word:''; if(t.includes(target)||target.includes(t)||t.replace(/[\s,。！？]/g,'')===target.replace(/[\s,。！？]/g,'')){ this.magicResult='correct'; this.magicDoorOpen=true; this.magicScore++; const rewards=['🐰','🐱','🐶','🦊','🐼','🦁','🐯','🦄','🎁','👑','⭐','🌈','🧸','🍭','🎈']; this.magicReward=rewards[Math.floor(Math.random()*rewards.length)]; this.playCheerSound(); setTimeout(()=>this.nextMagicRound(),3000); } else { this.magicResult='wrong'; setTimeout(()=>{this.magicResult=null;},2000); } }; rec.onerror=()=>{ this.magicListening=false; this.magicResult='wrong'; setTimeout(()=>{this.magicResult=null;},2000); }; rec.onend=()=>{ this.magicListening=false; }; rec.start(); },

        // ===== DRAW =====
        openDrawModal() { this.showDrawModal=true; this.$nextTick(()=>this.initCanvas()); },
        initCanvas() { this.canvas=this.$refs.drawCanvas; if(!this.canvas) return; this.ctx=this.canvas.getContext('2d'); this.ctx.fillStyle='#ffffff'; this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height); this.loadImageToCanvas(); },
        loadImageToCanvas() { if(this.currentObj.image&&this.currentObj.image.startsWith('data:image')){ const img=new Image(); img.onload=()=>{ this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height); this.ctx.fillStyle='#fff'; this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height); const r=Math.min(this.canvas.width/img.width,this.canvas.height/img.height); const w=img.width*r,h=img.height*r; this.ctx.drawImage(img,(this.canvas.width-w)/2,(this.canvas.height-h)/2,w,h); }; img.src=this.currentObj.image; } },
        clearCanvas() { if(this.ctx){ this.ctx.fillStyle='#fff'; this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height); } },
        saveCanvas() { if(this.canvas){ this.currentObj.image=this.canvas.toDataURL('image/png'); this.saveToLocalStorage(); } this.showDrawModal=false; },
        triggerUpload(cam) { const inp=document.createElement('input'); inp.type='file'; inp.accept='image/*'; if(cam) inp.capture='environment'; inp.onchange=(e)=>{ const f=e.target.files[0]; if(f){ const r=new FileReader(); r.onload=(ev)=>{ const img=new Image(); img.onload=()=>{ this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height); this.ctx.fillStyle='#fff'; this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height); const rr=Math.min(this.canvas.width/img.width,this.canvas.height/img.height); const w=img.width*rr,h=img.height*rr; this.ctx.drawImage(img,(this.canvas.width-w)/2,(this.canvas.height-h)/2,w,h); }; img.src=ev.target.result; }; r.readAsDataURL(f); } }; inp.click(); },
        async fetchWebImagesList() { this.isSearchingImage=true; this.searchResults=[]; const w=this.currentObj.word; for(let i=0;i<6;i++) this.searchResults.push('https://loremflickr.com/200/200/'+encodeURIComponent(w)+'?lock='+i); this.isSearchingImage=false; },
        selectWebImage(url) { const img=new Image(); img.crossOrigin='anonymous'; img.onload=()=>{ if(this.ctx){ this.ctx.clearRect(0,0,this.canvas.width,this.canvas.height); this.ctx.fillStyle='#fff'; this.ctx.fillRect(0,0,this.canvas.width,this.canvas.height); const r=Math.min(this.canvas.width/img.width,this.canvas.height/img.height); const w=img.width*r,h=img.height*r; this.ctx.drawImage(img,(this.canvas.width-w)/2,(this.canvas.height-h)/2,w,h); } }; img.src=url; },
        startDraw(e) { if(this.currentTool==='emoji'){ const rect=this.canvas.getBoundingClientRect(); const cx=(e.clientX||(e.touches&&e.touches[0].clientX))-rect.left; const cy=(e.clientY||(e.touches&&e.touches[0].clientY))-rect.top; this.ctx.font='24px sans-serif'; this.ctx.textAlign='center'; this.ctx.fillText(this.stampEmoji,cx,cy); } else { this.isDrawing=true; const rect=this.canvas.getBoundingClientRect(); const cx=(e.clientX||(e.touches&&e.touches[0].clientX))-rect.left; const cy=(e.clientY||(e.touches&&e.touches[0].clientY))-rect.top; this.ctx.beginPath(); this.ctx.moveTo(cx,cy); this.ctx.strokeStyle=this.brushColor; this.ctx.lineWidth=3; } },
        draw(e) { if(!this.isDrawing||this.currentTool!=='draw') return; e.preventDefault(); const rect=this.canvas.getBoundingClientRect(); const cx=(e.clientX||(e.touches&&e.touches[0].clientX))-rect.left; const cy=(e.clientY||(e.touches&&e.touches[0].clientY))-rect.top; this.ctx.lineTo(cx,cy); this.ctx.stroke(); },
        endDraw() { this.isDrawing=false; },

        // ===== EXCEL EXPORT (with per-character color, dot, underline) =====
        async exportExcelWithImages() {
            const wb = new ExcelJS.Workbook(); const ws = wb.addWorksheet('Flashcards');
            ws.columns = [{header:'卡組名稱',key:'deck',width:20},{header:'詞彙',key:'word',width:20},{header:'翻譯',key:'translation',width:15},{header:'真實圖片',key:'image',width:20},{header:'例句',key:'example',width:40},{header:'狀態',key:'status',width:15},{header:'隱藏圖片資料',key:'imgData',width:30},{header:'隱藏Phonics資料',key:'phonicsData',width:30}];
            ws.getColumn(7).hidden = true; ws.getColumn(8).hidden = true;
            for (const [dn, items] of Object.entries(this.decks)) {
                for (const item of items) {
                    // Build rich text for word cell with per-character colors, dots, underlines
                    const word = item.word || '';
                    const phonics = item.phonics || [];
                    const pm = {};
                    phonics.forEach(p => { if (p.charIndex !== undefined) pm[p.charIndex] = p; });
                    const rd = {deck:dn, word:'', translation:item.translation||'', image:'', example:item.example||'', status:item.status||'', imgData:'', phonicsData:JSON.stringify(phonics)};
                    // Create cell with rich text
                    const cell = ws.addRow(rd);
                    const wordCell = ws.getCell(cell.number, 2);
                    if (phonics.length > 0 && wordCell.model) {
                        const richText = { richText: [] };
                        for (let ci = 0; ci < [...word].length; ci++) {
                            const p = pm[ci] || {};
                            const color = (p.color || '#1e293b').replace('#','');
                            const hasUnderline = p.hasUnderline || false;
                            richText.richText.push({
                                text: [...word][ci],
                                font: { color: { argb: 'FF' + color }, underline: hasUnderline }
                            });
                            if (p.hasDot) {
                                const dotColor = (p.dotColor || p.color || '#1e293b').replace('#','');
                                richText.richText.push({
                                    text: '•',
                                    font: { color: { argb: 'FF' + dotColor }, size: 10 }
                                });
                            }
                        }
                        wordCell.value = richText;
                    }
                    cell.height = 100;
                    if (item.image && item.image.startsWith('data:image')) {
                        rd.imgData = item.image;
                        const b64 = item.image.split(',')[1]; const bin = atob(b64); const bytes = new Uint8Array(bin.length);
                        for (let j=0;j<bin.length;j++) bytes[j]=bin.charCodeAt(j);
                        const imgId = wb.addImage({buffer:bytes.buffer, extension:'png'});
                        ws.addImage(imgId, {tl:{col:3,row:cell.number-1}, ext:{width:120,height:120}});
                    } else { rd.image = item.image||''; }
                }
            }
            const buf = await wb.xlsx.writeBuffer();
            saveAs(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}), 'flashcard_data.xlsx');
        },

        saveToLocalStorage() { try { localStorage.setItem('flashcardData', JSON.stringify(this.decks)); } catch(e) {} }
    }
}
