.ss::-webkit-scrollbar{width:4px}.ss::-webkit-scrollbar-thumb{background:#c7d2fe;border-radius:2px}

.shk{animation:sx .5s}
@keyframes do{0%{transform:rotateY(0)}100%{transform:rotateY(-85deg)}}.doa{animation:do 1s forwards;transform-origin:left center}
@keyframes gp{0%,100%{box-shadow:0 0 20px gold}50%{box-shadow:0 0 50px gold,0 0 80px orange}}.gla{animation:gp 1.5s ease-in-out infinite}
@keyframes fiu{from{opacity:0;transform:scale(.5) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}.fiu{animation:fiu .5s ease-out}
@keyframes bi{0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}.bin{animation:bi .5s ease-out}
.zb{min-width:150px;min-height:150px;display:flex;align-items:center;justify-content:center}
.cb{min-width:50px;min-height:50px;display:flex;align-items:center;justify-content:center}
