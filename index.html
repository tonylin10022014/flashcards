<style>
.flip-inner {transition:transform .6s;transform-style:preserve-3d}
.is-flipped .flip-inner {transform:rotateY(180deg)}
.flip-f,.flip-b {backface-visibility:hidden;position:absolute;top:0;left:0;width:100%;height:100%}
.flip-b {transform:rotateY(180deg)}
canvas {touch-action:none}
.pc {position:relative;display:inline-grid;justify-items:center;align-items:center;padding:30px 4px 30px 4px;overflow:visible!important}
.pch {position:relative;text-align:center;padding:0 2px;overflow:visible!important}
.pdot {position:absolute;bottom:2px;left:50%;transform:translateX(-50%) translateY(100%);width:8px;height:8px;border-radius:50%}
.parc {position:absolute;top:2px;height:22px;border-bottom:none;border-radius:50% 50% 0 0;box-sizing:border-box;pointer-events:none}
@keyframes sb {0%{transform:scale(0) rotate(0);opacity:1}50%{transform:scale(1.5) rotate(180deg);opacity:1}100%{transform:scale(2.5) rotate(360deg) translateY(-100px);opacity:0}}
@keyframes sx {0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
.shk {animation:sx .5s}
@keyframes do {0%{transform:rotateY(0)}100%{transform:rotateY(-85deg)}}
.doa {animation:do 1s forwards;transform-origin:left center}
@keyframes gp {0%,100%{box-shadow:0 0 20px gold}50%{box-shadow:0 0 50px gold,0 0 80px orange}}
.gla {animation:gp 1.5s ease-in-out infinite}
@keyframes fiu {from{opacity:0;transform:scale(.5) translateY(20px)}to{opacity:1;transform:scale(1) translateY(0)}}
.fiu {animation:fiu .5s ease-out}
@keyframes bi {0%{transform:scale(0)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.bin {animation:bi .5s ease-out}
</style>
</head>

"image": "", "example": "", "status": "需複習", "phonics": []}, {"word": "cup", "translation": "", "image": "", "example": "", "status": "需複習", "phonics": []}, {"word": "dog", "translation": "", "image": "", "example": "", "status": "需複習", "phonics": []}, {"word": "door", "translation": "", "image": "", "example": "", "status": "需複習", "phonics": []}, {"word": "egg", "translation": "", "image": "", "example": "", "status": "需複習", "phonics": []}, {"word": "elephant", "translation": "", "image": "", "example": "", "status": "需複習", "phonics": []}, {"word": "fish", "translation": "", "image": "", "example": "", "status": "需複習", "phonics": []}, {"word": "fan", "translation": "", "image": "", "example": "", "status": "需複習", "phonics": []}, {"word": "girl", "translation": "", "image": "", "example": "", "status": "需複習", "phonics": []}, {"word": "grapes", "translation": "", "image": "", "example": "", "status": "需複習", "phonics": []}, {"word": "hat", "translation": "", "image": "", "example": "", "status": "需複習", "phonics": []}, {"word": "hand", "translation": "", "image": "", "example": "", "status": "需複習", "phonics": []}, {"word": "igloo", "translation": "", "image": "", "example": "", "status": "需複習", "phonics": []}, {"word": "ink", "translation": "", "image": "", "example": "", "status": "需複習", "phonics": []}, {"word": "jam", "translation": "", "image": "", "example": "", "status": "需複習", "phonics": []}, {"word": "juice", "translation": "", "image": "", "example": "", "status": "需複習", "phonics": []}, {"word": "kite", "translation": "", "image": "", "example": "", "status": "需複習", "phonics": []}, {"word": "king", "translation": "", "image": "", "example": "", "status": "需複習", "phonics": []}]}</script>
<div id="cc" class="fixed inset-0 pointer-events-none z-[100]"></div>
<div x-data="fa()" x-init="init()" class="w-full max-w-2xl px-4 flex flex-col items-center">

<!-- NORMAL MODE -->
<div x-show="cm==='normal'" class="w-full flex flex-col items-center">
<div class="w-full flex justify-between items-center mb-3">
<h1 class="text-2xl font-bold text-indigo-900">學習閃卡系統</h1>
<div class="flex gap-2">
<button @click="openAdd()" class="bg-indigo-600 text-white px-3 py-2 rounded shadow font-bold text-sm">➕ 新增</button>
<button @click="expXlsx()" class="bg-blue-600 text-white px-3 py-2 rounded shadow font-bold text-sm">📤 下載Excel</button>
</div></div>
<div class="w-full overflow-x-auto whitespace-nowrap mb-3 pb-2 border-b-2 border-gray-200">
<template x-for="d in dks" :key="d"><button @click="setD(d)" :class="cdn===d?'bg-indigo-600 text-white shadow-md':'bg-white text-indigo-600 border border-indigo-300'" class="px-4 py-2 mr-2 rounded-lg font-bold inline-block text-sm" x-text="d"></button></template>
</div>
<div class="flex flex-wrap justify-between items-center w-full mb-3 bg-white p-3 rounded-lg shadow-sm border gap-3">
<div class="flex items-center gap-2 cursor-pointer" @click="ap=!ap;if(ap)spk(co.word)"><span class="text-sm font-bold text-gray-700">自動發音</span><div class="relative inline-flex h-6 w-11 items-center rounded-full" :class="ap?'bg-green-500':'bg-gray-300'"><span class="inline-block h-4 w-4 rounded-full bg-white transition-transform" :class="ap?'translate-x-6':'translate-x-1'"></span></div></div>
<div class="flex items-center gap-2 flex-1 justify-end"><span class="text-sm font-bold text-gray-700">正面:</span><select x-model="dm" class="border-2 border-indigo-200 rounded-lg p-1 text-sm font-bold text-indigo-800 bg-indigo-50"><option value="word">僅詞彙</option><option value="translation">僅翻譯</option><option value="example">僅例句</option><option value="photo">僅照片</option><option value="word_translation">詞彙+翻譯</option><option value="word_example">詞彙+例句</option><option value="all">全顯示</option></select></div>
</div>
<div class="flex flex-wrap justify-between items-center w-full mb-4 gap-2">
<div class="flex gap-1 bg-white p-1 rounded-lg border shadow-sm flex-1"><button @click="fm='review';fl()" :class="fm==='review'?'bg-red-500 text-white':'text-gray-600'" class="flex-1 py-1 px-2 rounded font-bold text-xs">🔄 需複習</button><button @click="fm='all';fl()" :class="fm==='all'?'bg-indigo-500 text-white':'text-gray-600'" class="flex-1 py-1 px-2 rounded font-bold text-xs">📚 全部</button></div>
<button @click="cm='study'" class="px-3 py-2 bg-blue-600 text-white font-bold rounded-lg shadow text-sm">🎯 學習</button>
<button @click="cm='grid';ig()" class="px-3 py-2 bg-purple-600 text-white font-bold rounded-lg shadow text-sm">🔠 宮格</button>
<button @click="stw()" class="px-3 py-2 bg-pink-500 text-white font-bold rounded-lg shadow text-sm">🎮 拍拍</button>
<button @click="stm()" class="px-3 py-2 bg-amber-600 text-white font-bold rounded-lg shadow text-sm">🚪 通關</button>
</div>
<div class="flex justify-between w-full mb-2 text-sm font-bold bg-white p-3 rounded-lg shadow-sm"><span class="text-green-600">✅ <span x-text="kc"></span></span><span class="text-red-500">🔄 <span x-text="rc"></span></span><span class="text-indigo-800"><span x-text="al.length>0?ci+1:0"></span>/<span x-text="al.length"></span></span></div>
<div class="w-full mb-2 flex items-center gap-2 flex-wrap">
<button @click="tap()" class="px-3 py-2 rounded-lg font-bold text-sm" :class="ap2?'bg-red-500 text-white':'bg-blue-100 text-blue-700'"><span x-show="!ap2">▶️ 自動播放</span><span x-show="ap2">⏹️ 停止</span></button>
<div x-show="!ap2" class="flex items-center gap-1 text-xs"><span class="text-gray-500">每字</span><input type="number" x-model.number="api" min="500" max="10000" step="500" class="w-16 border rounded p-1 text-center"><span class="text-gray-500">ms</span></div>
<div class="text-xs font-bold text-gray-500" x-show="al.length>0">預估:<span x-text="ape"></span></div>
</div>
<template x-if="al.length>0">
<div class="w-full h-80 relative cursor-pointer select-none mb-4" :class="sd?'is-flipped':''" @click="sd=!sd" style="perspective:1000px">
<div class="flip-inner w-full h-full relative shadow-xl rounded-2xl">
<div class="flip-f bg-white rounded-2xl flex flex-col items-center justify-center border-t-8 p-4" :class="co.status==='已記住'?'border-green-500':'border-indigo-500'">
<div class="absolute top-2 right-2 flex gap-1 z-10">
<button @click.stop="openD()" class="text-gray-400 hover:text-purple-600 p-1 font-bold text-sm bg-purple-50 px-2 rounded border border-purple-100">📷</button>
<button @click.stop="openE()" class="text-gray-400 hover:text-indigo-600 p-1 font-bold text-sm bg-indigo-50 px-2 rounded border border-indigo-100">✏️</button>
<div @click.stop="spk(co.word)" class="p-1 cursor-pointer"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-indigo-400 hover:text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.586l4.707 4.707A1 1 0 0016 19.318V4.682a1 1 0 00-1.707-.707L9.586 8H7a2 2 0 00-2 2z"/></svg></div>
</div>
<div class="w-full flex-1 flex flex-col items-center justify-center overflow-hidden mt-6">
<template x-if="dm==='photo'||dm==='all'"><img x-show="co.image" :src="co.image" class="max-h-32 object-contain mb-3 rounded shadow-sm"></template>
<template x-if="dm==='word'||dm==='word_example'||dm==='word_translation'||dm==='all'"><div class="text-[3rem] md:text-[4.5rem] font-bold text-slate-800 text-center leading-tight mb-2 w-full" x-html="rp(co)"></div></template>
<template x-if="dm==='translation'||dm==='word_translation'||dm==='all'"><span class="text-xl md:text-2xl font-bold text-teal-600 text-center mb-2 px-4" x-text="co.translation||'(無翻譯)'"></span></template>
<template x-if="dm==='example'||dm==='word_example'||dm==='all'"><span class="text-sm md:text-lg text-slate-600 text-center px-4 line-clamp-3" x-text="co.example||'(無例句)'"></span></template>
</div></div>
<div class="flip-b bg-slate-50 rounded-2xl border-4 border-indigo-200 flex flex-col items-center justify-center p-4 text-center overflow-hidden">
<div class="absolute top-2 right-2 p-1 text-gray-400 text-xs font-bold">📖 背面</div>
<template x-if="co.image"><img :src="co.image" class="max-h-28 object-contain mb-3 rounded border bg-white shadow-sm"></template>
<div class="text-2xl font-bold text-indigo-900 mb-1 w-full" x-html="rp(co)"></div>
<template x-if="co.translation"><div class="text-lg font-bold text-teal-700 mb-2" x-text="co.translation"></div></template>
<template x-if="co.example"><div class="text-sm text-slate-700 bg-white p-3 rounded-lg shadow-sm w-full" x-text="co.example"></div></template>
</div></div></div>
</template>
<div class="flex justify-between w-full mb-4 gap-4" x-show="al.length>0"><button @click="pv()" class="flex-1 py-2 bg-gray-200 rounded-xl font-bold text-gray-700">⬅️</button><button @click="nx()" class="flex-1 py-2 bg-indigo-100 rounded-xl font-bold text-indigo-700">➡️</button></div>
<div class="flex justify-between w-full gap-4" x-show="al.length>0"><button @click="ms('已記住')" class="flex-1 py-3 border-2 border-green-500 rounded-xl font-bold" :class="co.status==='已記住'?'bg-green-500 text-white':'bg-white text-green-600'">✅ 已記住</button><button @click="ms('需複習')" class="flex-1 py-3 border-2 border-red-500 rounded-xl font-bold" :class="co.status==='需複習'?'bg-red-500 text-white':'bg-white text-red-600'">🔄 需複習</button></div>
</div>

<!-- STUDY -->
<div x-show="cm==='study'" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center select-none p-4" style="display:none">
<button @click="cm='normal';sap()" class="absolute top-6 right-6 p-4 text-gray-400 hover:text-red-500 text-xl font-bold z-50 bg-gray-100 rounded-full">✖</button>
<div class="absolute top-6 left-6 flex items-center gap-3 z-50"><button @click="tap()" class="px-4 py-2 rounded-full font-bold text-sm" :class="ap2?'bg-red-500 text-white':'bg-blue-100 text-blue-700'"><span x-show="!ap2">▶️ 自動</span><span x-show="ap2">⏹️ 停止</span></button><div class="text-xs font-bold text-gray-400" x-show="al.length>0">預估:<span x-text="ape"></span></div></div>
<div @click="nx()" class="w-full h-full flex flex-col items-center justify-center cursor-pointer">
<template x-if="dm==='photo'||dm==='all'"><img x-show="co.image" :src="co.image" class="max-h-[40vh] max-w-full object-contain mb-8 rounded-xl shadow-lg border-4 border-gray-100"></template>
<template x-if="dm==='word'||dm==='word_example'||dm==='word_translation'||dm==='all'"><div class="text-[12vw] md:text-[10vw] font-black text-slate-800 text-center leading-tight mb-4 w-full" x-html="rp(co)"></div></template>
<template x-if="dm==='translation'||dm==='word_translation'||dm==='all'"><span class="text-[6vw] md:text-[4vw] font-bold text-teal-600 text-center mb-6" x-text="co.translation||'(無)'"></span></template>
<template x-if="dm==='example'||dm==='word_example'||dm==='all'"><span class="text-[5vw] md:text-[3vw] font-bold text-slate-600 text-center px-8" x-text="co.example||'(無)'"></span></template>
</div>
<div class="absolute bottom-6 text-gray-300 text-sm font-bold" x-show="!ap2">點擊切換</div>
<div class="absolute bottom-6 text-blue-500 text-sm font-bold" x-show="ap2">自動播放中...</div>
</div>

<!-- GRID (50=5 cols) -->
<div x-show="cm==='grid'" class="w-full flex flex-col items-center" style="display:none">
<div class="w-full flex justify-between items-center mb-4"><button @click="cm='normal'" class="text-indigo-600 font-bold bg-indigo-50 px-4 py-2 rounded-lg">⬅️ 返回</button><h2 class="text-xl font-bold text-purple-700 flex-1 text-center" x-text="cdn+' 記憶檢測'"></h2></div>
<div class="flex flex-wrap gap-2 w-full mb-6">
<select x-model.number="gs" @change="ig()" class="border-2 border-purple-300 rounded-lg p-2 font-bold text-purple-800 outline-none"><option value="3">3宮格</option><option value="5">5宮格</option><option value="9" selected>9宮格</option><option value="10">10宮格</option><option value="16">16宮格</option><option value="25">25宮格</option><option value="50">50宮格</option></select>
<input type="number" x-model.number="gs" @change="ig()" min="1" max="100" class="w-16 border-2 border-purple-300 rounded-lg p-2 text-center font-bold" placeholder="自訂">
<select x-model="gdt" class="flex-1 border-2 border-purple-300 rounded-lg p-2 font-bold text-purple-800 outline-none"><option value="word">詞彙</option><option value="translation">翻譯</option><option value="example">例句</option><option value="image">圖片</option></select>
<button @click="ig()" class="bg-purple-500 text-white font-bold px-6 py-2 rounded-lg shadow">🔄 換批</button>
</div>
<div class="w-full flex justify-center"><div :style="'grid-template-columns:repeat('+gc+',1fr);max-width:'+(gi.length>20?'1000px':'100%')+';'" class="grid gap-1 md:gap-2 w-full mx-auto">
<template x-for="(it,gi2) in gi" :key="gi2"><div class="bg-white border-2 border-indigo-100 shadow-sm rounded-xl flex flex-col items-center justify-center p-1 md:p-2 cursor-pointer aspect-square" @click="spk(it.word)">
<template x-if="gdt==='word'"><div class="font-bold text-slate-800 w-full text-center" :class="gi.length<=3?'text-5xl':gi.length<=9?'text-3xl md:text-5xl':gi.length<=16?'text-xl md:text-2xl':gi.length<=25?'text-base md:text-lg':'text-xs md:text-sm'" x-html="rp(it)"></div></template>
<template x-if="gdt==='translation'"><span class="font-bold text-teal-700 text-center" :class="gi.length<=3?'text-4xl':gi.length<=9?'text-2xl md:text-4xl':gi.length<=25?'text-sm md:text-lg':'text-[10px] md:text-xs'" x-text="it.translation||'(無)'"></span></template>
<template x-if="gdt==='example'"><span class="font-bold text-slate-600 text-center line-clamp-4" :class="gi.length<=9?'text-sm':'text-[10px]'" x-text="it.example||'(無)'"></span></template>
<template x-if="gdt==='image'"><div class="w-full h-full flex items-center justify-center"><template x-if="it.image"><img :src="it.image" class="max-h-full max-w-full object-contain rounded"></template><template x-if="!it.image"><span class="text-gray-400 font-bold text-xs">(無圖)</span></template></div></template>
</div></template></div></div></div>

<!-- WHACK -->
<div x-show="cm==='whack'" class="w-full flex flex-col items-center" style="display:none">
<div class="w-full flex justify-between items-center mb-4"><button @click="cm='normal'" class="text-pink-600 font-bold bg-pink-50 px-4 py-2 rounded-lg">⬅️ 返回</button><h2 class="text-2xl font-black text-pink-600 flex-1 text-center">🎮 快手拍拍樂</h2></div>
<div class="w-full flex justify-around items-center mb-4 bg-gradient-to-r from-pink-100 to-purple-100 p-3 rounded-xl shadow"><div class="text-center"><div class="text-xs font-bold text-gray-500">分數</div><div class="text-3xl font-black text-pink-600" x-text="ws"></div></div><div class="text-center"><div class="text-xs font-bold text-gray-500">回合</div><div class="text-3xl font-black text-purple-600"><span x-text="wr"></span>/<span x-text="wm"></span></div></div><div class="text-center"><div class="text-xs font-bold text-gray-500">正確率</div><div class="text-3xl font-black text-teal-600"><span x-text="wr>0?Math.round(ws/wr*100):0"></span>%</div></div></div>
<button @click="spk(wt?wt.word:'')" class="mb-6 bg-gradient-to-r from-pink-500 to-purple-500 text-white px-8 py-6 rounded-3xl font-black text-2xl shadow-lg hover:scale-105 transition bin">🔊 聽一聽</button>
<div class="flex flex-wrap justify-center gap-4 md:gap-8 w-full mb-6" x-show="!wgo"><template x-for="(c,i) in wc" :key="wr+'-'+i"><div @click="wck(c)" class="cursor-pointer select-none" :class="c.shaking?'shk':'bin'"><div class="bg-gradient-to-br from-yellow-100 to-orange-100 border-4 border-orange-300 rounded-3xl shadow-xl flex flex-col items-center justify-center" style="width:180px;height:220px"><template x-if="c.image"><img :src="c.image" class="max-h-20 max-w-full object-contain mb-2 rounded"></template><div class="text-5xl font-black text-orange-700 text-center px-2" x-text="c.word"></div></div></div></template></div>
<div x-show="wgo" class="text-center fiu"><div class="text-6xl mb-4">🎉</div><div class="text-3xl font-black text-pink-600 mb-2">遊戲結束！</div><div class="text-xl font-bold text-gray-600 mb-4">得分：<span x-text="ws"></span>/<span x-text="wm"></span></div><button @click="stw()" class="bg-pink-500 text-white px-6 py-3 rounded-xl font-bold text-lg shadow-lg">🔄 再玩</button></div>
</div>

<!-- MAGIC -->
<div x-show="cm==='magic'" class="w-full flex flex-col items-center" style="display:none">
<div class="w-full flex justify-between items-center mb-4"><button @click="cm='normal'" class="text-amber-600 font-bold bg-amber-50 px-4 py-2 rounded-lg">⬅️ 返回</button><h2 class="text-2xl font-black text-amber-700 flex-1 text-center">🚪 魔法通關密語</h2></div>
<div class="w-full flex justify-around items-center mb-4 bg-gradient-to-r from-amber-100 to-yellow-100 p-3 rounded-xl shadow"><div class="text-center"><div class="text-xs font-bold text-gray-500">通關</div><div class="text-3xl font-black text-amber-600" x-text="ms2"></div></div><div class="text-center"><div class="text-xs font-bold text-gray-500">嘗試</div><div class="text-3xl font-black text-purple-600" x-text="ma"></div></div></div>
<div class="relative my-8" style="perspective:800px" x-show="mw"><div class="absolute inset-0 flex items-center justify-center" style="width:220px;height:320px"><div x-show="mdo" class="text-8xl bin" x-text="mr"></div></div>
<div :class="mdo?'doa':'gla'" class="relative" style="width:220px;height:320px;background:linear-gradient(135deg,#8B4513,#A0522D);border:8px solid #FFD700;border-radius:15px 15px 0 0;transform-style:preserve-3d;transform-origin:left center;box-shadow:0 0 30px rgba(255,215,0,0.5)"><div class="absolute top-4 left-1/2 -translate-x-1/2 text-3xl">🏰</div><div class="flex items-center justify-center h-full"><div class="text-6xl font-black text-yellow-100 text-center px-4" style="text-shadow:2px 2px 4px rgba(0,0,0,0.5)" x-text="mw?mw.word:''"></div></div><div class="absolute right-3 top-1/2 w-4 h-4 rounded-full bg-yellow-300 shadow"></div></div></div>
<div class="flex flex-col items-center gap-3 mt-4"><button @click="ssr()" :disabled="ml" class="rounded-full font-black text-white shadow-lg transition-all hover:scale-110 disabled:opacity-50" :class="ml?'bg-red-500 animate-pulse w-32 h-32 text-4xl':'bg-gradient-to-r from-amber-500 to-orange-500 w-28 h-28 text-3xl'"><span x-show="!ml">🎤</span><span x-show="ml">🎧</span></button><div class="text-lg font-bold" :class="ml?'text-red-500':'text-gray-500'" x-text="ml?'聆聽中...':'按下唸出通關密語'"></div><div x-show="mres==='wrong'" class="text-xl font-bold text-red-500 fiu">不對哦～再試一次！</div><div x-show="mres==='correct'" class="text-xl font-bold text-green-500 fiu">🎉 答對了！</div><button x-show="mres==='wrong'" @click="spk(mw?mw.word:'')" class="text-sm font-bold text-blue-500 underline">🔊 聽提示</button><button @click="nmr()" class="text-sm font-bold text-gray-400 underline mt-2">⏭️ 換門</button></div>
</div>

<!-- DRAW -->
<div x-show="showD" class="fixed inset-0 bg-black bg-opacity-70 z-50 flex items-center justify-center p-2" style="display:none">
<div class="bg-white w-full max-w-lg rounded-2xl p-4 shadow-2xl flex flex-col items-center relative">
<h3 class="text-lg font-bold text-purple-800 mb-2">📷 <span x-text="co.word"></span></h3>
<div class="flex flex-wrap justify-center gap-2 mb-2 w-full"><button @click="fwi()" class="px-3 py-2 bg-purple-600 text-white rounded-lg font-bold text-sm flex-1">🌐 搜圖</button><button @click="tu(true)" class="px-2 py-2 bg-blue-100 text-blue-800 rounded-lg font-bold text-sm">📷 拍照</button><button @click="tu(false)" class="px-2 py-2 bg-green-100 text-green-800 rounded-lg font-bold text-sm">📁 相簿</button><button @click="cc()" class="px-2 py-2 bg-gray-200 text-gray-700 rounded-lg font-bold text-sm">🗑️ 清空</button></div>
<div x-show="sr.length>0" class="w-full flex gap-2 overflow-x-auto mb-2 p-2 bg-gray-50 rounded-lg border"><template x-for="u in sr" :key="u"><img :src="u" @click="swi(u)" class="h-16 w-16 object-cover cursor-pointer rounded-lg border-2 border-transparent hover:border-purple-500 flex-shrink-0"></template></div>
<div class="w-full flex justify-between items-center mb-2 bg-indigo-50 p-2 rounded-lg border border-indigo-100"><select x-model="ct" class="border border-indigo-300 rounded p-1 text-sm font-bold bg-white"><option value="draw">🖌️ 畫筆</option><option value="emoji">✨ 印章</option></select><div x-show="ct==='draw'" class="flex items-center gap-2"><span class="text-sm font-bold text-gray-600">色:</span><input type="color" x-model="bc" class="w-8 h-8 rounded cursor-pointer border-none p-0"></div><div x-show="ct==='emoji'" class="flex items-center gap-2"><select x-model="se" class="border rounded p-1 text-lg bg-white"><option value="⭐">⭐</option><option value="❤️">❤️</option><option value="✅">✅</option><option value="❌">❌</option><option value="🍎">🍎</option><option value="😀">😀</option><option value="👍">👍</option></select></div></div>
<div x-show="isi" class="absolute inset-0 bg-white bg-opacity-90 z-20 flex flex-col items-center justify-center"><div class="animate-spin h-10 w-10 border-4 border-purple-500 rounded-full border-t-transparent"></div><span class="mt-2 text-purple-700 font-bold">搜尋中...</span></div>
<canvas x-ref="dc" width="400" height="300" class="border-2 border-purple-200 rounded-lg shadow-inner bg-white touch-none" @mousedown.sd2($event)" @mousemove.drw($event)" @mouseup.ed2()" @mouseleave.ed2()" @touchstart.sd2($event)" @touchmove.drw($event)" @touchend.ed2()"></canvas>
<div class="flex gap-2 mt-3"><button @click="showD=false" class="bg-gray-300 px-4 py-2 rounded-lg font-bold">取消</button><button @click="sc2()" class="bg-purple-600 text-white px-4 py-2 rounded-lg font-bold">💾 儲存</button></div></div></div>

<!-- EDIT (stroke coloring + add/replace) -->
<div x-show="showE" class="fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4" style="display:none">
<div class="bg-white w-full max-w-3xl rounded-2xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
<h3 class="text-lg font-bold text-indigo-800 mb-3">✏️ 編輯單詞與 Phonics</h3>
<div class="mb-3"><label class="text-sm font-bold text-gray-600">詞彙</label><input x-model="ew" @input="sep()" class="border-2 border-indigo-200 rounded-lg p-2 w-full text-lg font-bold"></div>
<div class="flex items-center gap-3 mb-3 bg-gray-50 p-2 rounded-lg border"><span class="text-sm font-bold text-gray-600">📋 自動填入:</span><select x-model="afm" class="border rounded p-1 text-sm font-bold bg-white"><option value="replace">🔄 取代</option><option value="add">➕ 加入</option></select><span class="text-xs text-gray-400" x-show="afm==='add'">新結果加在後面</span><span class="text-xs text-gray-400" x-show="afm==='replace'">新結果取代</span></div>
<button @click="ata()" :disabled="it2||ise2" class="w-full mb-3 bg-gradient-to-r from-teal-500 to-amber-500 text-white px-4 py-3 rounded-lg font-bold text-sm disabled:opacity-50"><span x-show="!it2&&!ise2">🚀 一鍵自動翻譯+例句</span><span x-show="it2||ise2">⏳ 處理中...</span></button>
<div class="mb-2"><label class="text-sm font-bold text-gray-600">翻譯</label><div class="flex gap-2"><input x-model="etr" class="border-2 border-teal-200 rounded-lg p-2 flex-1"><button @click="at()" :disabled="it2" class="bg-teal-500 text-white px-3 py-2 rounded-lg font-bold text-sm disabled:opacity-50"><span x-show="!it2">🌐</span><span x-show="it2">⏳</span></button></div></div>
<div x-show="tr.length>0" class="mb-3 border rounded-lg p-2 bg-teal-50 max-h-32 overflow-y-auto"><div class="text-xs font-bold text-teal-700 mb-1">翻譯選項 (點擊<span x-text="afm==='add'?'加入':'取代'"></span>):</div><template x-for="(t,i) in tr" :key="'t'+i"><div @click="str(i)" class="cursor-pointer hover:bg-teal-100 p-1 rounded text-sm border-b border-teal-100" x-text="t"></div></template></div>
<div class="mb-2"><label class="text-sm font-bold text-gray-600">例句</label><div class="flex gap-2"><input x-model="ee" class="border-2 border-amber-200 rounded-lg p-2 flex-1"><button @click="ase()" :disabled="ise2" class="bg-amber-500 text-white px-3 py-2 rounded-lg font-bold text-sm disabled:opacity-50"><span x-show="!ise2">📝</span><span x-show="ise2">⏳</span></button></div></div>
<div x-show="er.length>0" class="mb-3 border rounded-lg p-2 bg-amber-50 max-h-32 overflow-y-auto"><div class="text-xs font-bold text-amber-700 mb-1">例句選項 (點擊<span x-text="afm==='add'?'加入':'取代'"></span>):</div><template x-for="(e,i) in er" :key="'e'+i"><div @click="ser(i)" class="cursor-pointer hover:bg-amber-100 p-1 rounded text-sm border-b border-amber-100" x-text="e"></div></template></div>
<div class="border-2 border-purple-200 rounded-lg p-3 mb-3"><div class="text-sm font-bold text-purple-700 mb-2">🔤 Phonics</div>
<div class="flex items-center gap-2 mb-2 bg-pink-50 p-2 rounded border border-pink-200"><span class="text-xs font-bold text-pink-700">🖌️ 筆畫著色筆:</span><input type="color" x-model="sbc" class="w-10 h-8 cursor-pointer"><span class="text-xs text-gray-400">點擊中文筆畫逐筆著色</span></div>
<div class="flex gap-2 overflow-x-auto pb-2"><template x-for="(ch,idx) in [...ew]" :key="idx"><div class="flex flex-col items-center min-w-[110px] border rounded-lg p-2 bg-purple-50">
<div class="mb-1 min-h-[60px] flex items-center justify-center" x-html="rcs(idx)" @click="hsc($event)"></div>
<div class="cursor-pointer h-6 flex items-center justify-center mb-1 w-full border-t border-purple-200 pt-1" @click="ep[idx].hasDot=!ep[idx].hasDot;if(ep[idx].hasDot&&!ep[idx].dotColor)ep[idx].dotColor=ep[idx].color"><div x-show="ep[idx].hasDot" class="w-3 h-3 rounded-full" :style="'background:'+(ep[idx].dotColor||ep[idx].color)"></div><span x-show="!ep[idx].hasDot" class="text-gray-300 text-xs">加點</span></div>
<label class="text-xs text-gray-600">字色</label><input type="color" x-model="ep[idx].color" class="w-12 h-8 mb-1 cursor-pointer" @change="ep[idx].strokeColors={}">
<div x-show="ep[idx].hasDot"><label class="text-xs text-gray-600">點色</label><input type="color" x-model="ep[idx].dotColor" class="w-12 h-8 mb-1 cursor-pointer"></div>
<label class="text-xs text-gray-600 mt-1">底線</label><input type="checkbox" x-model="ep[idx].hasUnderline" class="mb-1 w-4 h-4">
<div x-show="idx<[...ew].length-1" class="mt-2 flex flex-col items-center border-t pt-2 border-purple-200 w-full"><label class="text-xs text-gray-600">連線→</label><input type="checkbox" x-model="ep[idx].connectRight" class="mb-1 w-4 h-4"><div x-show="ep[idx].connectRight"><label class="text-xs text-gray-600">線色</label><input type="color" x-model="ep[idx].lineColor" class="w-12 h-8 cursor-pointer"></div></div>
</div></template></div>
<div class="mt-2 p-2 bg-white rounded border border-purple-100 text-center"><div class="text-xs text-gray-400 mb-1">預覽:</div><div class="text-2xl font-bold" x-html="rp({word:ew,phonics:ep})"></div></div></div>
<div class="flex gap-2 justify-end"><button @click="showE=false" class="bg-gray-300 px-4 py-2 rounded-lg font-bold">取消</button><button @click="se2()" class="bg-indigo-600 text-white px-4 py-2 rounded-lg font-bold">💾 儲存</button></div></div></div>
</div>

<script>
function fa() {
    return {
        decks:{}, cdn:'', cm:'normal', dm:'word', fm:'review', ap:false, sd:false, ci:0, al:[], co:{},
        ap2:false, apt:null, api:1000,
        showD:false, ct:'draw', bc:'#FF0000', se:'⭐', sr:[], isi:false, id2:false, cv:null, cx:null,
        showE:false, ew:'', etr:'', ee:'', ep:[], em2:'edit',
        tr:[], it2:false, er:[], ise2:false, afm:'replace', sbc:'#FF0000', sdc:{},
        gi:[], gdt:'word', gs:9,
        wc:[], wt:null, ws:0, wr:0, wm:10, wgo:false,
        mw:null, mdo:false, ml:false, mres:null, mr:null, ms2:0, ma:0,

        get dks() { return Object.keys(this.decks||{}) },
        get kc() { return this.al.filter(i=>i.status==='已記住').length },
        get rc() { return this.al.filter(i=>i.status==='需複習').length },
        get ape() { const s=this.al.length*(this.api/1000); return Math.floor(s/60)+'分'+Math.round(s%60)+'秒' },
        get gc() { const n=this.gi.length||parseInt(this.gs)||9; const t=parseInt(this.gs)||9; const lk={3:3,5:5,9:3,10:5,16:4,25:5,50:5}; let c=lk[t]||Math.ceil(Math.sqrt(t)); if(n<c)c=n; if(n<=3)c=n; return c; },

        async init() {
            try { const d=document.getElementById('dd'); if(d) this.decks=JSON.parse(d.textContent); } catch(e) {}
            const s=localStorage.getItem('flashcardData'); if(s){ try{ this.decks=JSON.parse(s); }catch(e){} }
            if(this.dks.length>0) this.setD(this.dks[0]); await this.plsd();
        },
        async plsd() { const cs=new Set(); for(const items of Object.values(this.decks)) { for(const item of items) { for(const ch of [...(item.word||'')]) { if(/[\u4e00-\u9fff]/.test(ch)) cs.add(ch); } } } for(const ch of cs) await this.lsd(ch); },
        async lsd(ch) { if(this.sdc[ch]) return this.sdc[ch]; try { const r=await fetch('https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/'+encodeURIComponent(ch)+'.json'); if(!r.ok) return null; const d=await r.json(); this.sdc[ch]=d; return d; } catch(e) { return null; } },

        setD(n) { this.cdn=n; this.fl(); },
        fl() { const d=this.decks[this.cdn]||[]; this.al=this.fm==='review'?d.filter(i=>i.status==='需複習'):[...d]; this.ci=0; if(this.al.length>0)this.co=this.al[0]; },
        nx() { if(!this.al.length)return; this.ci=(this.ci+1)%this.al.length; this.co=this.al[this.ci]; this.sd=false; if(this.ap)this.spk(this.co.word); },
        pv() { if(!this.al.length)return; this.ci=(this.ci-1+this.al.length)%this.al.length; this.co=this.al[this.ci]; this.sd=false; },
        ms(s) { this.co.status=s; this.sls(); setTimeout(()=>this.nx(),200); },
        tap() { this.ap2?this.sap():this.stap(); },
        stap() { if(!this.al.length)return; this.ap2=true; this.apt=setInterval(()=>this.nx(),this.api); if(this.ap)this.spk(this.co.word); },
        sap() { this.ap2=false; if(this.apt){ clearInterval(this.apt); this.apt=null; } },
        ig() { const d=this.decks[this.cdn]||[]; const sz=Math.min(parseInt(this.gs)||9,d.length); this.gi=[...d].sort(()=>Math.random()-0.5).slice(0,sz); },
        spk(w) { if(!w)return; if('speechSynthesis'in window){ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(w); u.lang=/[\u4e00-\u9fff]/.test(w)?'zh-TW':'en-US'; u.rate=0.8; speechSynthesis.speak(u); } },

        rp(obj) {
            const w=(obj&&obj.word)||''; if(!obj||!obj.phonics||obj.phonics.length===0) return w;
            const cs=[...w]; const n=cs.length; if(n===0)return '';
            const pm={}; obj.phonics.forEach(p=>{ if(p.charIndex!==undefined)pm[p.charIndex]=p; });
            const arcs=[]; let i=0;
            while(i<n-1){ const p=pm[i]; if(p&&p.connectRight){ const st=i; const lc=p.lineColor||'#6366f1'; while(i<n-1&&pm[i]&&pm[i].connectRight)i++; arcs.push({start:st,end:i,color:lc}); } else i++; }
            const hc=cs.some(c=>/[\u4e00-\u9fff]/.test(c)); const cw=hc?60:42; const mw=n*cw;
            let h='<div class="pc" style="grid-template-columns:repeat('+n+',1fr);min-width:'+mw+'px;">';
            cs.forEach((ch,idx)=>{
                const p=pm[idx]||{}; const col=p.color||'#1e293b'; const hd=p.hasDot||false; const dc=p.dotColor||col;
                const hu=p.hasUnderline||false; const sc=p.strokeColors||{};
                const ic=/[\u4e00-\u9fff]/.test(ch); let ch2='';
                if(ic&&this.sdc[ch]) {
                    const d=this.sdc[ch];
                    ch2='<svg viewBox="0 0 1024 1024" style="width:50px;height:50px;display:inline-block;"><g transform="matrix(1,0,0,-1,0,1024)">';
                    d.strokes.forEach((sp,si)=>{ const s2=sc[si]||col; ch2+='<path d="'+sp+'" fill="'+s2+'"/>'; });
                    ch2+='</g></svg>';
                } else {
                    const pt=p.partial||'full'; const sec=p.secondaryColor||'#94a3b8';
                    if(pt==='full'||!pt) { ch2='<span style="color:'+col+';'+(hu?'text-decoration:underline;text-decoration-color:'+col+';':'')+'">'+ch+'</span>'; }
                    else { let g=pt==='top'?'to bottom,'+col+' 50%,'+sec+' 50%':pt==='bottom'?'to top,'+col+' 50%,'+sec+' 50%':pt==='left'?'to right,'+col+' 50%,'+sec+' 50%':'to left,'+col+' 50%,'+sec+' 50%'; ch2='<span style="background:linear-gradient('+g+');-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;'+(hu?'text-decoration:underline;':'')+'">'+ch+'</span>'; }
                }
                h+='<div class="pch">'+ch2; if(hd) h+='<div class="pdot" style="background:'+dc+';"></div>'; h+='</div>';
            });
            arcs.forEach(a=>{ const lp=(a.start+0.5)/n*100; const wp=(a.end-a.start)/n*100; h+='<div class="parc" style="left:'+lp+'%;width:'+wp+'%;border:3px solid '+a.color+';"></div>'; });
            h+='</div>'; return h;
        },

        rcs(idx) {
            const cs=[...(this.ew||'')]; const ch=cs[idx]; if(!ch)return '';
            const p=this.ep[idx]||{}; const col=p.color||'#1e293b'; const sc=p.strokeColors||{};
            const ic=/[\u4e00-\u9fff]/.test(ch);
            if(ic&&this.sdc[ch]) {
                const d=this.sdc[ch];
                let svg='<svg viewBox="0 0 1024 1024" style="width:60px;height:60px;"><g transform="matrix(1,0,0,-1,0,1024)">';
                d.strokes.forEach((sp,si)=>{ const s2=sc[si]||col; svg+='<path d="'+sp+'" fill="'+s2+'" data-char-idx="'+idx+'" data-stroke-idx="'+si+'" style="cursor:pointer;"/>'; });
                svg+='</g></svg>'; return svg;
            }
            const pt=p.partial||'full'; const sec=p.secondaryColor||'#94a3b8';
            if(pt==='full'||!pt) return '<span style="font-size:2rem;font-weight:bold;color:'+col+';">'+ch+'</span>';
            let g=pt==='top'?'to bottom,'+col+' 50%,'+sec+' 50%':pt==='bottom'?'to top,'+col+' 50%,'+sec+' 50%':pt==='left'?'to right,'+col+' 50%,'+sec+' 50%':'to left,'+col+' 50%,'+sec+' 50%';
            return '<span style="font-size:2rem;font-weight:bold;background:linear-gradient('+g+');-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;">'+ch+'</span>';
        },

        hsc(e) { if(e.target.tagName==='path'&&e.target.dataset.charIdx!==undefined){ this.tsc(parseInt(e.target.dataset.charIdx),parseInt(e.target.dataset.strokeIdx)); } },
        tsc(ci,si) { if(!this.ep[ci].strokeColors)this.ep[ci].strokeColors={}; const cur=this.ep[ci].strokeColors[si]||this.ep[ci].color||'#1e293b'; if(cur===this.sbc) delete this.ep[ci].strokeColors[si]; else this.ep[ci].strokeColors[si]=this.sbc; this.ep[ci].strokeColors=JSON.parse(JSON.stringify(this.ep[ci].strokeColors)); },

        openAdd() { this.ew=''; this.etr=''; this.ee=''; this.ep=[]; this.tr=[]; this.er=[]; this.em2='add'; this.showE=true; },
        openE() { this.ew=this.co.word||''; this.etr=this.co.translation||''; this.ee=this.co.example||''; this.tr=[]; this.er=[]; this.em2='edit'; this.sep(); this.showE=true; this.$nextTick(async()=>{ for(const ch of [...this.ew]){ if(/[\u4e00-\u9fff]/.test(ch))await this.lsd(ch); } }); },
        sep() { const cs=[...(this.ew||'')]; const old=[...this.ep]; this.ep=cs.map((ch,idx)=>old[idx]||{charIndex:idx,color:'#1e293b',hasDot:false,dotColor:'#1e293b',partial:'full',secondaryColor:'#94a3b8',connectRight:false,lineColor:'#6366f1',hasUnderline:false,strokeColors:{}}); },
        se2() { if(this.em2==='add'){ if(!this.decks[this.cdn])this.decks[this.cdn]=[]; this.decks[this.cdn].push({word:this.ew,translation:this.etr,image:'',example:this.ee,status:'需複習',phonics:JSON.parse(JSON.stringify(this.ep))}); } else { this.co.word=this.ew; this.co.translation=this.etr; this.co.example=this.ee; this.co.phonics=JSON.parse(JSON.stringify(this.ep)); } this.sls(); this.fl(); this.showE=false; },

        async at() { this.it2=true; const w=this.ew; if(!w){ this.it2=false; return; } const iz=/[\u4e00-\u9fff]/.test(w); const sl=iz?'zh-TW':'en', tl=iz?'en':'zh-TW'; const nr=new Set();
            try{ const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(w)+'&langpair='+sl+'|'+tl); const d=await r.json(); if(d.responseData&&d.responseData.translatedText)nr.add(d.responseData.translatedText); if(d.matches)d.matches.forEach(m=>{if(m.translation)nr.add(m.translation);}); }catch(e){}
            try{ const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl='+sl+'&tl='+tl+'&dt=t&q='+encodeURIComponent(w)); const d=await r.json(); if(d[0])d[0].forEach(it=>{if(it[0])nr.add(it[0]);}); }catch(e){}
            try{ const r=await fetch('https://lingva.ml/api/v1/'+sl+'/'+tl+'/'+encodeURIComponent(w)); const d=await r.json(); if(d.translation)nr.add(d.translation); }catch(e){}
